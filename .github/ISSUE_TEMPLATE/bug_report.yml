name: Bug report
description: Report a reproducible problem using synthetic or redacted evidence.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach captured articles, downloaded images, signed URLs, cookies, credentials, personal data, or private machine paths. Report vulnerabilities through GitHub private vulnerability reporting.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS Apple Silicon
        - macOS Intel
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Project tag/commit, Node.js version, and optional Python version.
      placeholder: v0.2.0, Node 20.18.1
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Affected route
      options:
        - discovery
        - HTTP/Cheerio
        - Crawlee
        - Puppeteer
        - Crawl4AI sidecar
        - image analysis handoff
        - finalize or validate
        - installation or CI
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Redacted reproduction
      description: Use the synthetic fixture or a minimal redacted example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed credentials, private paths, personal data, signed URLs, raw article content, and third-party images.
          required: true
