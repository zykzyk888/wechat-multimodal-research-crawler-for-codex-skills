name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/sp-pachong-seo-wenzhang-caiji/scripts/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install locked runtime
        run: npm ci --prefix skills/sp-pachong-seo-wenzhang-caiji/scripts

      - name: Check optional Python adapter syntax
        run: python -m py_compile skills/sp-pachong-seo-wenzhang-caiji/scripts/crawl4ai-adapter.py

      - name: Audit dependency advisories
        run: npm audit --prefix skills/sp-pachong-seo-wenzhang-caiji/scripts --audit-level=high

      - name: Run repository verification
        run: npm run ci
