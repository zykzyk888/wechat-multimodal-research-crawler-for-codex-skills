name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: skills/sp-pachong-seo-wenzhang-caiji/scripts/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install locked runtime
        run: npm ci --prefix skills/sp-pachong-seo-wenzhang-caiji/scripts

      - name: Check optional Python adapter syntax
        run: python -m py_compile skills/sp-pachong-seo-wenzhang-caiji/scripts/crawl4ai-adapter.py

      - name: Audit dependency advisories
        run: npm audit --prefix skills/sp-pachong-seo-wenzhang-caiji/scripts --audit-level=high

      - name: Run repository verification
        run: npm run ci

      - name: Verify installed Chrome auto-detection
        run: node scripts/test-platform-support.mjs --require-browser
