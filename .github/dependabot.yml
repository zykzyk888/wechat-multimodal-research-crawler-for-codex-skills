version: 2
updates:
  - package-ecosystem: npm
    directory: /skills/sp-pachong-seo-wenzhang-caiji/scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      runtime-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
